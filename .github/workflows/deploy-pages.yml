name: Deploy SOPP Agents and package MEUST Companion

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  package-deezer-companion:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Package MEUST Deezer companion
        run: |
          cd sonometre
          zip -r ../MEUST-Deezer-Companion.zip extension
      - name: Upload companion ZIP
        uses: actions/upload-artifact@v4
        with:
          name: MEUST-Deezer-Companion
          path: MEUST-Deezer-Companion.zip
          if-no-files-found: error
          retention-days: 30

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Generate favicon and installation icons from logo-app.webp
        run: |
          python -m pip install --disable-pip-version-check Pillow
          python scripts/generate_icons.py

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
